# Brings up SQL Server and the site together.
#
#   cd web && docker compose up
#
# The site applies its own schema on start-up, and creates the database if it
# is not there yet, so nothing else has to be set up first.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "IqTest!Local2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ConnectionString: "Server=db,1433;Database=IqTest;User Id=sa;Password=IqTest!Local2026;TrustServerCertificate=True;Encrypt=False"
      Database__MigrateOnStartup: "true"
      QuestionBank__Path: "/app/shared/questions.json"

volumes:
  mssql-data:
